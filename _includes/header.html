<header class="site-header">
  <div class="site-shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Olivia Chandler home">
      <span class="wordmark-mark" aria-hidden="true">OC</span>
      <span>Olivia Chandler</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url contains '/experience' %} aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
