<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#f4efe9">
<title>{% if page.url == '/' %}{{ site.title | escape }} — Technology, AI &amp; Growth{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}</title>
<link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title | escape }}{% else %}{{ page.title | default: site.title | escape }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
